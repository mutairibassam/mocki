<!DOCTYPE html>
<html>
  <head>
    <style>
      th, td {
        text-align: left;
        padding: 8px;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
    <title>Web Benchmark Tool</title>
  </head>
  <body>
    <form id="benchmark-form">
      <div>
        <label for="protocol-http">HTTP</label>
        <input type="radio" id="protocol-http" name="protocol" value="http" checked>
        <label for="protocol-https">HTTPS</label>
        <input type="radio" id="protocol-https" name="protocol" value="https">
      </div>
      <br>
      <div>
        <label for="base-url">Base URL:</label>
        <input type="text" id="base-url" name="base-url" >
        <label for="port">Port:</label>
        <input type="text" id="port" name="port" >
        <label for="path">Path:</label>
        <input type="text" id="path" name="path" >
        <label for="method">Method:</label>
        <select id="method" name="method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
          <option value="PATCH">PATCH</option>
        </select>
      </div>
      <br>
      <div>
        <label for="connection-count">Number of Connections:</label>
        <input type="text" id="connection-count" name="connection-count" >
        <label for="requester-count">Number of Requesters (per connection):</label>
        <input type="text" id="requester-count" name="requester-count" >
        <label for="duration">Duration:</label>
        <input type="text" id="duration" name="duration" >
      </div>
      <br> 
      <div>
        <label for="headers">Headers:</label>
        <div id="headers">
          <div>
            <input type="text" name="header-key[]" placeholder="Key">
            <input type="text" name="header-value[]" placeholder="Value">
            <button type="button" id="add-header">+</button>
          </div>
        </div>
      </div>
      <br>
      <label for="payload">Payload:</label>
      <div>
        <textarea id="payload" name="payload" rows="20" cols="60"></textarea>
        <div id="payload-error"></div>
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
    <h2>Load test result</h2>
    <div id="parentElementId"></div>
    <script src="app.js"></script>
  </body>
</html>
